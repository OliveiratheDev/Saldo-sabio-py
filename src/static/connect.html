<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Finance — Pluggy Connect</title>
  <script src="https://cdn.pluggy.ai/pluggy-connect/latest/pluggy-connect.js"></script>
  <style>
    :root {
      font-family: system-ui, Segoe UI, sans-serif;
      color: #1a1a1a;
      line-height: 1.5;
    }
    body { max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; font-size: 0.875rem; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 0.5rem; margin-top: 0.25rem; }
    .row { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; }
    button {
      margin-top: 1.25rem;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { font-size: 0.8125rem; color: #555; margin-top: 0.25rem; }
    pre {
      margin-top: 1rem;
      padding: 1rem;
      background: #f4f4f4;
      border-radius: 6px;
      overflow: auto;
      font-size: 0.8125rem;
    }
    .err { color: #b00020; }
    .ok { color: #0d6b2c; }
  </style>
</head>
<body>
  <h1>Ligar conta (Open Finance via Pluggy)</h1>
  <p class="hint">
    Garante que a API está a correr (ex.: <code>uvicorn main:app --reload</code> na pasta <code>src</code>)
    e que <code>PLUGGY_CLIENT_ID</code> / <code>PLUGGY_CLIENT_SECRET</code> estão definidos.
  </p>

  <label for="itemId">Item ID (opcional)</label>
  <input id="itemId" type="text" placeholder="Só para atualizar uma conexão existente" autocomplete="off" />
  <p class="hint">Deixa vazio para uma <strong>nova</strong> ligação. Depois do sucesso, copia o ID abaixo para usar em <code>/api/openfinance/sync</code>.</p>

  <div class="row">
    <input id="sandbox" type="checkbox" checked />
    <label for="sandbox" style="margin: 0; font-weight: normal;">Mostrar conectores sandbox (recomendado em testes)</label>
  </div>

  <button id="btn" type="button">Abrir Pluggy Connect</button>

  <p id="status"></p>
  <pre id="log"></pre>

  <script>
    (function () {
      var btn = document.getElementById("btn");
      var logEl = document.getElementById("log");
      var statusEl = document.getElementById("status");

      function pluggyCtor() {
        var g = window.PluggyConnect;
        if (!g) return null;
        return g.default || g;
      }

      function setStatus(msg, cls) {
        statusEl.textContent = msg || "";
        statusEl.className = cls || "";
      }

      function setLog(obj) {
        logEl.textContent = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
      }

      btn.addEventListener("click", async function () {
        var Ctor = pluggyCtor();
        if (!Ctor) {
          setStatus("SDK Pluggy não carregou (verifica rede / CDN).", "err");
          return;
        }

        btn.disabled = true;
        setStatus("A pedir connect token à API…", "");
        setLog("");

        var itemRaw = document.getElementById("itemId").value.trim();
        var body = {};
        if (itemRaw) body.item_id = itemRaw;

        var res;
        try {
          res = await fetch("/api/openfinance/connect-token", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
        } catch (e) {
          setStatus("Falha de rede ao falar com a API.", "err");
          setLog(String(e));
          btn.disabled = false;
          return;
        }

        var data;
        try {
          data = await res.json();
        } catch (e) {
          data = null;
        }

        if (!res.ok) {
          setStatus("Erro " + res.status + " ao criar connect token.", "err");
          setLog(data || "(corpo não JSON)");
          btn.disabled = false;
          return;
        }

        var token = data && (data.connectToken || data.connect_token || data.accessToken);
        if (!token) {
          setStatus("Resposta sem connectToken. Confirma a resposta da Pluggy abaixo.", "err");
          setLog(data);
          btn.disabled = false;
          return;
        }

        setStatus("Token OK. A abrir o widget…", "ok");

        var includeSandbox = document.getElementById("sandbox").checked;

        var pluggy = new Ctor({
          connectToken: token,
          includeSandbox: includeSandbox,
          language: "pt",
          onSuccess: function (payload) {
            var item = payload && payload.item;
            var id = item && (item.id || item.itemId);
            setStatus("Ligação criada ou atualizada com sucesso.", "ok");
            setLog({
              itemId: id,
              item: item,
              dica: "Usa este itemId no POST /api/openfinance/sync e /api/openfinance/sync-accounts.",
            });
            btn.disabled = false;
          },
          onError: function (err) {
            setStatus("Erro no Connect: " + (err && err.message ? err.message : "desconhecido"), "err");
            setLog(err || {});
            btn.disabled = false;
          },
        });

        pluggy.init();
      });
    })();
  </script>
</body>
</html>
